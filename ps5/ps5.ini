# CTPS5 platform defaults. Copy to /data/eggoftime/ps5.ini only if needed.
# Restart after changing output height (1080, 1440, 2160).
output_height=2160
# Target rate, not a performance guarantee (30 or 60).
target_fps=60
# Runtime render scale, 1 through 11.
render_scale=3
# Legacy first-launch selection. Independent switches are saved by Mods
# in mods/pack-states.ini. Default folder: mods/graphics/.
# Named packs: mods/packs/<id>/graphics/. Restart after toggling packs.
active_pack=default
