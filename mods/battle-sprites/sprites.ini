# CTPS5 Faithful HD battle sprites. Requires a compatible sprite-mod host.
# Generated at startup from your own USA/YQUE CT.nds. No game art supplied.
# All settings take effect after fully restarting CTPS5 Mods.
enabled=1
# Supported detail scales: 2 or 4. Sprite placement and size stay unchanged.
scale=4
# Subtle palette-relative shading, 0-100; preserves live colour effects.
shading=65
